on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

name: test-coverage

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Coverage floor
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          pct <- covr::percent_coverage(cov)
          cat(sprintf("### Coverage: %.2f%%\n", pct), file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
          # shortcut: whole-repo floor only, no patch coverage; add diff coverage if PRs start sneaking in untested C
          if (pct < 90) stop(sprintf("Coverage %.2f%% is below the 90%% floor", pct))
        shell: Rscript {0}
